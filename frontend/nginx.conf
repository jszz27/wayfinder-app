# Cloud Run listens on $PORT; 8080 is its default.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Plan.md section 8, as amended: /saved and /conversations are real
    # addresses, so a reload or a pasted link has to reach index.html and
    # let the router decide. Without this they would 404 -- the classic
    # way a single-page app breaks only in production.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset names, so they can be cached hard. index.html cannot:
    # it is what points at the current hashes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayfinder-backend-ws"
version = "0.1.0"
description = "Wayfinder WebSocket caption server (Plan.md section 3)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Read directly rather than relied on through uvicorn's extras: the
    # services load their own .env, so this is a first-class dependency.
    "python-dotenv>=1.0",
    "websockets>=13.0",
    # Reads one caption session and writes its lines (Plan.md section 6).
    # The schema and its migrations belong to backend-rest.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    # Verifies the access tokens backend-rest signs. The two services share
    # JWT_SECRET and nothing else; see docs/sprint-3.md.
    "pyjwt>=2.9",
]

[project.optional-dependencies]
google = [
    "google-cloud-speech>=2.27",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]
# Only for tests/language_matrix.py, which synthesises speech in eleven
# languages to check what the recogniser does with each pair. Separate
# from [dev] because it is a slow, paid, hand-run verification rather than
# part of the suite, and separate from the runtime because nothing the
# service does needs to speak.
verify = [
    "google-cloud-texttospeech>=2.16",
    "websockets>=13.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayfinder-backend-ws"
version = "0.1.0"
description = "Wayfinder WebSocket caption server (Plan.md section 3)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Read directly rather than relied on through uvicorn's extras: the
    # services load their own .env, so this is a first-class dependency.
    "python-dotenv>=1.0",
    "websockets>=13.0",
    # Reads one caption session and writes its lines (Plan.md section 6).
    # The schema and its migrations belong to backend-rest.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[project.optional-dependencies]
google = [
    "google-cloud-speech>=2.27",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayfinder-backend-rest"
version = "0.1.0"
description = "Wayfinder REST API server (Plan.md section 3)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Plan.md section 6. backend-rest owns the schema and the migrations;
    # backend-ws holds a narrow connection for caption lines only.
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    # Auth (Plan.md section 4). argon2 rather than passlib, which is no
    # longer maintained.
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    # EmailStr on the signup body needs this. FastAPI brings pydantic in
    # but not the extra, so leaving it undeclared worked on a machine that
    # happened to have it and failed on every clean install -- which is
    # what CI caught the first time it ran.
    "pydantic[email]>=2.9",
    # Read directly rather than relied on through uvicorn's extras: the
    # services load their own .env, so this is a first-class dependency.
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gemini = [
    "google-genai>=1.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
